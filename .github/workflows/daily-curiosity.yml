name: Daily Curiosity Lab

on:
  schedule:
    - cron: "17 18 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curiosity-lab
  cancel-in-progress: false

jobs:
  daily-project:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate project
        run: python3 scripts/curiosity-lab.py

      - name: Test project
        run: |
          python3 - <<'PY'
          import datetime
          import pathlib
          import subprocess
          import sys

          today = datetime.date.today().isoformat()
          projects = list(pathlib.Path("projects").glob(today + "-*"))

          if not projects:
              raise SystemExit("Today's project was not generated.")

          for project in projects:
              subprocess.run(
                  [sys.executable, str(project / "reproduce.py")],
                  check=True
              )
              subprocess.run(
                  [
                      sys.executable,
                      "-m", "unittest", "discover",
                      "-s", str(project / "tests"), "-v"
                  ],
                  check=True
              )
          PY

      - name: Commit and push
        run: |
          git config user.name "justinobomeghie"
          git config user.email "justin_obomeghie@berkeley.edu"

          git add README.md projects/

          if git diff --cached --quiet; then
            echo "No new project to commit."
            exit 0
          fi

          git commit -m "Curiosity Lab: daily research $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
